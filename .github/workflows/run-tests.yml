# Check stage: shellcheck and the full bin/verify harness on every PR and push to main.
name: run-tests
run-name: ${{ github.event.pull_request.title || github.event.head_commit.message }} · ${{ github.actor }}

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck entrypoint.sh bin/*

      - name: Validate compose.yaml
        run: docker compose -f compose.yaml config -q

      - name: bin/verify
        run: bin/verify
